<script>

/* =========================================
   TELEGRAM URL
   ========================================= */

const TELEGRAM_URL =
"https://t.me/+caH0g7E5gOJkM2Y1";


/* =========================================
   5 SECOND AUTO REDIRECT

   5 → 4 → 3 → 2 → 1
   Then Telegram opens automatically.

   NO Subscribe event on auto redirect.
   ========================================= */

let seconds = 5;

const count =
document.getElementById("count");

const timer =
setInterval(function(){

seconds--;

if(seconds > 0){

count.textContent = seconds;

}else{

clearInterval(timer);

/* AUTO REDIRECT */
window.location.href = TELEGRAM_URL;

}

},1000);


/* =========================================
   SUBSCRIBE EVENT

   Fires ONLY when user manually
   clicks the Telegram button.
   ========================================= */

document
.getElementById("telegramBtn")
.addEventListener("click",function(){

try{

fbq(
'track',
'Subscribe'
);

}catch(e){}

});

</script>
